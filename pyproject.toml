[build-system]
requires = ["setuptools>=68,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.2.0"
description = "Lightweight terminal coding agent for local models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
]

[project.optional-dependencies]
web = ["ddgs>=9,<10"]

[project.scripts]
assistant = "assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
