[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-lite"
version = "0.1.0"
description = "Minimal TUI coding agent for local models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "ddgs>=9",
]

[project.scripts]
opencode-lite = "opencode_lite.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
